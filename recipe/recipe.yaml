schema_version: 1

context:
  version: "2.5.34"

package:
  name: libgphoto2
  version: ${{ version }}

source:
  url: https://github.com/gphoto/libgphoto2/releases/download/v${{ version }}/libgphoto2-${{ version }}.tar.xz
  sha256: 51993f5d9bfb6b4e5925cbbe5883085791bff6f81bcacb8ffe1b783ce76d586a

build:
  number: 2
  skip: win
  dynamic_linking:
    overlinking_behavior: error
    # The camera/port drivers link against this package's own libraries via
    # their soname symlinks, which the overlinking check reports on Linux.
    missing_dso_allowlist:
      - "**/libgphoto2*.so*"
  script:
    - ./configure --prefix=$PREFIX --disable-static
    - make -j${CPU_COUNT}
    - make install

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
    - libtool
    - pkgconf
    - gettext
  host:
    - libusb
    - libexif
    - libjpeg-turbo
    - libxml2-devel
    - gettext
    - libltdl
    - libiconv
  run_exports:
    - ${{ pin_subpackage('libgphoto2', upper_bound='x.x') }}

tests:
  - package_contents:
      lib:
        - gphoto2
        - gphoto2_port
      include:
        - gphoto2/gphoto2.h
  # Load the library and its camera/port drivers; needs no camera attached.
  - script:
      file: run_test.py
      interpreter: python
    requirements:
      run:
        - python

about:
  homepage: http://www.gphoto.org/
  repository: https://github.com/gphoto/libgphoto2
  license: LGPL-2.1-or-later
  license_file: COPYING
  summary: Library for accessing hundreds of digital cameras over USB/serial
  description: |
    libgphoto2 is a C library that enables applications to access digital
    cameras and other USB/serial devices. It supports hundreds of camera
    models and is the foundation for the gphoto2 CLI and various image
    management applications.

extra:
  recipe-maintainers:
    - baradejoo
